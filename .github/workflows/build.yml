name: build

on: pull_request

jobs:

  test:

    name: ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    strategy:

      matrix:

        toolchain:
          - macos-latest-clang
          - macos-12-clang
          - ubuntu-latest-clang
          - ubuntu-latest-gcc
          - windows-2022-msvc
          - windows-latest-msvc
          - windows-latest-clang

        include:
          - toolchain: macos-latest-clang
            os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++
            cmake_opts: -DALPACA_BUILD_TESTS=on -DALPACA_BUILD_BENCHMARKS=on -DALPACA_BUILD_SAMPLES=on -DCMAKE_BUILD_TYPE=Release

          - toolchain: macos-12-clang
            os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++
            cmake_opts: -DALPACA_BUILD_TESTS=on -DALPACA_BUILD_BENCHMARKS=on -DALPACA_BUILD_SAMPLES=on -DCMAKE_BUILD_TYPE=Release

          - toolchain: ubuntu-latest-clang
            os: ubuntu-latest
            c_compiler: clang
            cxx_compiler: clang++
            cmake_opts: -DALPACA_BUILD_TESTS=on -DALPACA_BUILD_BENCHMARKS=on -DALPACA_BUILD_SAMPLES=on -DCMAKE_BUILD_TYPE=Release

          - toolchain: ubuntu-latest-gcc
            os: ubuntu-latest
            c_compiler: cc
            cxx_compiler: g++
            cmake_opts: -DALPACA_BUILD_TESTS=on -DALPACA_BUILD_BENCHMARKS=on -DALPACA_BUILD_SAMPLES=on -DCMAKE_BUILD_TYPE=Release

          - toolchain: windows-2022-msvc
            os: windows-2022
            c_compiler: msvc
            cxx_compiler: msvc
            cmake_opts: -DALPACA_BUILD_TESTS=on -DALPACA_BUILD_BENCHMARKS=on -DALPACA_BUILD_SAMPLES=on -DCMAKE_BUILD_TYPE=Release

          - toolchain: windows-latest-msvc
            os: windows-latest
            c_compiler: msvc
            cxx_compiler: msvc
            cmake_opts: -DALPACA_BUILD_TESTS=on -DALPACA_BUILD_BENCHMARKS=on -DALPACA_BUILD_SAMPLES=on -DCMAKE_BUILD_TYPE=Release

          - toolchain: windows-latest-clang
            os: windows-latest
            c_compiler: clang-cl
            cxx_compiler: clang-cl
            cmake_opts: -DALPACA_BUILD_TESTS=on -DALPACA_BUILD_BENCHMARKS=on -DALPACA_BUILD_SAMPLES=on -DCMAKE_BUILD_TYPE=Release -T ClangCL

    steps:

    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Configure
      working-directory: test
      run: cmake -S . -B build ${{ matrix.cmake_opts }}
      env:
        CC: ${{ matrix.c_compiler }}
        CXX: ${{ matrix.cxx_compiler }}

    - name: Build for ${{ matrix.os }} with ${{ matrix.compiler }}
      working-directory: test
      run: cmake --build build

    - name: Test
      if: ${{ ! startsWith(matrix.os, 'windows') }}
      working-directory: test/build
      run: ./tests

    - name: Test (Windows)
      if: ${{ startsWith(matrix.os, 'windows') }}
      working-directory: test/build
      run: ./Debug/tests.exe

  python:

    name: pyalpaca (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pybind11
      run: python -m pip install pybind11

    - name: Configure
      shell: bash
      run: cmake -S . -B build -DALPACA_BUILD_PYTHON_LIB=on -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DPython_EXECUTABLE="$(python -c "import sys; print(sys.executable)")"

    - name: Build
      run: cmake --build build --config Release --target pyalpaca

    - name: Test
      shell: bash
      run: |
        # the module lands in build/python (single-config) or build/python/Release (MSVC)
        export PYTHONPATH="$PWD/build/python:$PWD/build/python/Release"
        python -m unittest discover -s python/test -v
